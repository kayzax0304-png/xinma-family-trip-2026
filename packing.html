<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17372f"><title>旅行打包工具</title><style>
:root{--ink:#17372f;--paper:#fffdf8;--cream:#f3efe5;--line:#d9d4c7;--coral:#e46649;--muted:#617a73}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px Arial,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:68px;padding:0 clamp(16px,6vw,84px);display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;gap:10px;align-items:center}.seal{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 19px Georgia}.brand b{display:block;font-size:18px}.brand small{font-size:9px;letter-spacing:.12em;color:var(--muted)}.nav{display:flex;gap:16px;align-items:center;font-weight:bold;font-size:13px}.nav a{color:var(--ink);text-decoration:none}.nav a:last-child{border:1px solid var(--ink);border-radius:99px;padding:7px 10px}.wrap{max-width:1100px;margin:auto;padding:30px 20px 80px}.hero{padding:clamp(28px,5vw,55px);background:radial-gradient(circle at 84% 17%,#edb9a9,transparent 21%),radial-gradient(circle at 73% 98%,#c7d6bd,transparent 28%);border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;font-weight:bold;color:var(--coral);letter-spacing:.14em}.hero h1{font:700 clamp(38px,5.5vw,64px)/1 Georgia,"Songti SC",serif;margin:12px 0}.hero p{color:var(--muted);line-height:1.7;margin:0}.screen{display:none}.screen.active{display:block}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:18px}.toolbar h2{font:700 28px Georgia,"Songti SC",serif;margin:0}.primary,.ghost,.danger{border:0;padding:12px 15px;font-weight:bold}.primary{background:var(--ink);color:#fff}.ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0eb;border:1px solid #f0b19f;color:#973d28}.trip-grid,.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.trip-card,.template{background:var(--paper);border:1px solid var(--line);padding:20px;text-align:left;min-height:170px;position:relative}.trip-card.active{outline:2px solid var(--ink)}.badge{font-size:11px;color:var(--coral);font-weight:bold;letter-spacing:.08em}.trip-card h3,.template h3{font:700 25px Georgia,"Songti SC",serif;margin:12px 0 8px}.trip-card p,.template p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.trip-card .pct{position:absolute;right:17px;top:17px;font-weight:bold}.progress{height:7px;background:#e9e5da;margin:17px 0 10px}.progress i{height:100%;display:block;background:var(--coral);width:0}.template-actions{margin-top:18px}.empty{padding:25px;background:var(--paper);border:1px dashed #a9b8af;color:var(--muted)}.trip-head{background:var(--ink);color:#fff;padding:23px;margin-bottom:14px}.trip-head .row{display:flex;justify-content:space-between;align-items:start;gap:12px}.trip-head h2{font:700 clamp(28px,4vw,40px) Georgia,"Songti SC",serif;margin:5px 0}.trip-head p{color:#d7e1dd;margin:0;font-size:13px}.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#f08a6f var(--pct),#ffffff33 0);position:relative}.ring:before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--ink)}.ring b{z-index:1;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.categories{display:grid;gap:10px}.category{background:var(--paper);border:1px solid var(--line)}.category summary{list-style:none;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:16px;cursor:pointer}.category summary::-webkit-details-marker{display:none}.category h3{font:700 23px Georgia,"Songti SC",serif;margin:0}.category small{color:var(--muted);display:block;margin-top:4px}.category .count{border:1px solid var(--line);border-radius:99px;padding:7px;font-size:12px}.items{border-top:1px solid var(--line);padding:0 16px}.item{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #ebe6db;padding:13px 0}.item:last-child{border:0}.item input[type=checkbox]{appearance:none;width:22px;height:22px;border:2px solid #718b83;border-radius:4px;margin:0}.item input:checked{background:var(--coral);border-color:var(--coral)}.item input:checked:after{content:'✓';color:#fff;font-weight:bold;position:relative;left:3px;top:-1px}.item.done .label{text-decoration:line-through;color:#82938e}.owner{font-size:11px;color:var(--muted);margin-top:4px}.icon{border:0;background:transparent;font-size:18px;padding:9px;color:var(--ink)}.add-item{width:100%;padding:13px;margin:10px 0;background:#eef2eb;border:1px dashed #9baea4;color:var(--ink);font-weight:bold}.modal{position:fixed;inset:0;z-index:30;background:#17372faa;display:none;align-items:end;justify-content:center}.modal.show{display:flex}.dialog{background:var(--paper);width:min(650px,100%);max-height:92vh;overflow:auto;padding:24px;border-radius:20px 20px 0 0}.dialog h2{font:700 29px Georgia,"Songti SC",serif;margin:0 0 18px}.field{display:block;margin:13px 0}.field span{font-weight:bold;font-size:13px;display:block;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #b9c2ba;background:#fff;border-radius:0}.dialog .actions{justify-content:flex-end;margin-top:22px}.fab{display:none;position:fixed;bottom:18px;right:18px;z-index:20;width:58px;height:58px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:28px;box-shadow:0 4px 16px #17372f77}.notice{font-size:12px;color:var(--muted);line-height:1.6;margin-top:16px}@media(max-width:760px){header{height:60px}.nav{gap:9px;font-size:12px}.nav a:first-child{display:none}.nav a:last-child{padding:6px 8px}.wrap{padding:20px 14px 80px}.hero{padding:32px 20px}.trip-grid,.template-grid{grid-template-columns:1fr}.toolbar{align-items:start}.toolbar h2{font-size:25px}.trip-card,.template{min-height:140px}.item{grid-template-columns:26px 1fr auto}.icon{font-size:19px;padding:10px}.fab{display:block}.dialog{padding:20px}.categories{gap:8px}.category summary{padding:14px}.category h3{font-size:21px}}
</style></head><body>
<header><div class="brand"><span class="seal">新</span><div><b>旅行打包</b><small>PACK · PLAN · GO</small></div></div><nav class="nav"><a href="index.html">路线地图</a><a href="packing.html">旅行打包</a></nav></header>
<section class="hero"><span class="eyebrow">可复用 · 本机保存 · 手机优先</span><h1>每一次出发，<br>都从轻松打包开始。</h1><p>选择模板创建行程，按同行人分配物品，在手机上直接新增、编辑、删除。所有数据只保存在当前浏览器。</p></section>
<main class="wrap"><section id="home" class="screen active"><div class="toolbar"><h2>我的行程</h2><button class="primary" onclick="openTripEditor()">＋ 新建行程</button></div><div class="trip-grid" id="tripGrid"></div><p class="notice">每个行程的资料和勾选进度彼此独立。换浏览器或清除浏览器数据后不会保留。</p><div class="toolbar" style="margin-top:34px"><h2>模板库</h2></div><div class="template-grid" id="templateGrid"></div></section><section id="detail" class="screen"><button class="ghost" onclick="showHome()">← 返回我的行程</button><div id="detailContent" style="margin-top:14px"></div></section></main>
<button class="fab" id="fab" title="新增物品">＋</button><div class="modal" id="modal"><form class="dialog" id="form"></form></div>
<script>
const KEY='travel-packing-tool-v2',uid=()=>Math.random().toString(36).slice(2,10),clone=x=>JSON.parse(JSON.stringify(x));
const base={family:['出发前办理','贵重随身小包','主行李箱 · 衣物','主行李箱 · 海边泳池','主行李箱 · 防晒雨具防蚊','主行李箱 · 洗护健康','主行李箱 · 电子设备','儿童专属','每日出门复核'],short:['证件与支付','衣物与洗护','电子设备','儿童物品','每日出门复核'],work:['证件与行程','商务衣物','电子与办公','洗护健康','每日出门复核']};
const templates=[
 {id:'family',name:'亲子家庭旅行',desc:'适合带孩子的多天旅行，含泳池、防晒与儿童出行。',tags:'亲子 / 海边 / 城市',cat:base.family,items:[['出发前办理','证件、签证/入境材料与交通酒店确认单','全家'],['贵重随身小包','护照、银行卡、现金、充电宝、常用药','全家'],['主行李箱 · 衣物','轻薄衣物、步行鞋、睡衣、薄外套','全家'],['儿童专属','推车、雨罩、安抚物、水杯、零食、备用衣物','儿童'],['每日出门复核','防晒、雨具、水、湿巾、儿童备用衣物','全家']]},
 {id:'short',name:'家庭短途旅行',desc:'适合周末或 2–3 天小旅行，精简而不漏。',tags:'家庭 / 短途 / 周末',cat:base.short,items:[['证件与支付','身份证件、酒店确认、支付方式','全家'],['衣物与洗护','换洗衣物、睡衣、洗漱用品','全家'],['电子设备','手机、充电线、充电宝','全家'],['儿童物品','水杯、零食、安抚物、备用衣物','儿童'],['每日出门复核','钥匙、证件、水、雨具','全家']]},
 {id:'work',name:'个人出差',desc:'适合短中期商务出行，兼顾会议和通勤。',tags:'个人 / 商务 / 城市',cat:base.work,items:[['证件与行程','身份证/护照、交通酒店确认、发票信息','本人'],['商务衣物','会议服装、皮鞋、轻薄外套','本人'],['电子与办公','电脑、充电器、转换插头、耳机、名片','本人'],['洗护健康','洗漱用品、常用药、眼罩','本人'],['每日出门复核','证件、电脑、充电、会议资料','本人']]}
];
function makeTrip(t,name,dest,companions,climate,activity){return{id:uid(),name:name||t.name,destination:dest||'',companions:companions||'本人',climate:climate||t.tags,activity:activity||'',template:t.id,categories:t.cat.map((title,i)=>({id:uid(),title,items:t.items.filter(x=>x[0]===title).map(x=>({id:uid(),text:x[1],owner:x[2],done:false}))}))}};
const example={id:'xinma-2026',name:'国庆新马亲子游',destination:'槟城 · 吉隆坡 · 新加坡',companions:'2位成人 + 贝果（3岁）',climate:'热带湿热 / 阵雨 / 城市步行',activity:'海边泳池、升旗山、TRX 玩水、Night Safari、4段航班',template:'family',categories:base.family.map(title=>({id:uid(),title,items:[]}))};
const seed=[['出发前办理','3人护照、航班酒店确认单与保险','全家'],['出发前办理','按当日官方要求完成马来西亚、新加坡入境手续','成人'],['出发前办理','确认托运/随身行李额度，尤其 AK715','成人'],['贵重随身小包','证件、现金、银行卡、充电宝、常用药','全家'],['主行李箱 · 衣物','轻薄衣物、步行鞋、凉鞋、薄外套','全家'],['主行李箱 · 衣物','KL 正式晚餐的透气稍正式服装','成人'],['主行李箱 · 海边泳池','泳衣、防晒泳衣、水鞋、湿衣收纳袋','全家'],['主行李箱 · 防晒雨具防蚊','防晒、雨衣、遮阳帽、驱蚊液','全家'],['主行李箱 · 洗护健康','儿童与成人常用药、体温计、湿巾','全家'],['主行李箱 · 电子设备','Type G 转换插头、充电线、手机防水袋','全家'],['儿童专属','婴儿车、遮阳罩、雨罩、安抚物、水杯','儿童'],['儿童专属','TRX 玩水备用衣物与 Night Safari 薄外套','儿童'],['每日出门复核','水、防晒、雨具、湿巾、零食、酒店房卡','全家']];
seed.forEach(([cat,text,owner])=>example.categories.find(c=>c.title===cat).items.push({id:uid(),text,owner,done:false}));
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'')}catch(e){}if(!state||!Array.isArray(state.trips))state={trips:[example],activeId:null};
let active=null;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function getTrip(id){return state.trips.find(t=>t.id===id)}function counts(t){const a=t.categories.flatMap(c=>c.items);return[a.filter(i=>i.done).length,a.length]};
function showHome(){active=null;document.getElementById('home').classList.add('active');document.getElementById('detail').classList.remove('active');document.getElementById('fab').style.display='none';renderHome()}
function showTrip(id){active=id;state.activeId=id;save();document.getElementById('home').classList.remove('active');document.getElementById('detail').classList.add('active');document.getElementById('fab').style.display='block';renderDetail()}
function renderHome(){const grid=document.getElementById('tripGrid');grid.innerHTML=state.trips.map(t=>{let[d,n]=counts(t),p=n?Math.round(d/n*100):0;return `<button class="trip-card ${t.id===state.activeId?'active':''}" onclick="showTrip('${t.id}')"><span class="badge">${t.destination||'未填写目的地'}</span><b class="pct">${p}%</b><h3>${esc(t.name)}</h3><p>${esc(t.companions||'未填写同行人')} · ${esc(t.climate||'未设置标签')}</p><div class="progress"><i style="width:${p}%"></i></div><p>${d}/${n} 项已准备</p></button>`}).join('')||'<div class="empty">还没有行程。用模板或“新建行程”开始。</div>';document.getElementById('templateGrid').innerHTML=templates.map(t=>`<article class="template"><span class="badge">${t.tags}</span><h3>${t.name}</h3><p>${t.desc}</p><div class="template-actions"><button class="ghost" onclick="openTripEditor('${t.id}')">用此模板新建</button></div></article>`).join('')}
function renderDetail(){const t=getTrip(active);if(!t){showHome();return}const[d,n]=counts(t),pct=n?Math.round(d/n*100):0;document.getElementById('detailContent').innerHTML=`<section class="trip-head"><div class="row"><div><span class="badge" style="color:#f08a6f">本次出行</span><h2>${esc(t.name)}</h2><p>${esc(t.destination||'未填写目的地')} · ${esc(t.companions||'未填写同行人')}</p><p style="margin-top:7px">${esc(t.climate||'')} ${t.activity?'· '+esc(t.activity):''}</p></div><div class="ring" style="--pct:${pct}%"><b>${pct}%</b></div></div><div class="actions"><button class="ghost" onclick="openTripEditor(null,'${t.id}')">编辑行程设置</button><button class="ghost" onclick="duplicateTrip('${t.id}')">复制行程</button><button class="danger" onclick="deleteTrip('${t.id}')">删除行程</button></div></section><section class="categories">${t.categories.map((c,index)=>{let cd=c.items.filter(x=>x.done).length;return `<details class="category" ${index<2?'open':''}><summary><div><h3>${esc(c.title)}</h3><small>${c.items.length?'分类内物品可按人分配':''}</small></div><span class="count">${cd}/${c.items.length}</span></summary><div class="items">${c.items.map(i=>`<div class="item ${i.done?'done':''}"><input aria-label="完成 ${esc(i.text)}" type="checkbox" ${i.done?'checked':''} onchange="toggleItem('${c.id}','${i.id}',this.checked)"><div class="label">${esc(i.text)}<div class="owner">${esc(i.owner||'未分配')}</div></div><div><button class="icon" aria-label="编辑物品" onclick="openItemEditor('${c.id}','${i.id}')">✎</button><button class="icon" aria-label="删除物品" onclick="deleteItem('${c.id}','${i.id}')">×</button></div></div>`).join('')}<button class="add-item" onclick="openItemEditor('${c.id}')">＋ 新增物品</button></div></details>`}).join('')}</section>`}
function toggleItem(cid,iid,done){let i=getTrip(active).categories.find(c=>c.id===cid).items.find(i=>i.id===iid);i.done=done;save();renderDetail()}
function openModal(html){document.getElementById('form').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function openTripEditor(templateId,editId){const trip=editId?getTrip(editId):null,t=templates.find(t=>t.id===(templateId||trip?.template))||templates[0];openModal(`<h2>${trip?'编辑行程':'新建行程'}</h2><label class="field"><span>行程名称</span><input name="name" required value="${esc(trip?.name||'') }" placeholder="例如：2026 春节东京行"></label><label class="field"><span>目的地</span><input name="destination" value="${esc(trip?.destination||'')}" placeholder="例如：东京 · 镰仓"></label><label class="field"><span>同行人</span><input name="companions" value="${esc(trip?.companions||'')}" placeholder="例如：2位成人 + 1位儿童"></label><label class="field"><span>气候／活动标签</span><input name="climate" value="${esc(trip?.climate||t.tags)}" placeholder="例如：温和 / 步行 / 泳池"></label><label class="field"><span>活动补充</span><input name="activity" value="${esc(trip?.activity||'')}" placeholder="例如：海边、滑雪、商务会议"></label>${trip?'':`<label class="field"><span>使用模板</span><select name="template">${templates.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${x.name}</option>`).join('')}</select></label>`}<div class="actions"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">保存行程</button></div>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(trip){Object.assign(trip,{name:f.get('name'),destination:f.get('destination'),companions:f.get('companions'),climate:f.get('climate'),activity:f.get('activity')});save();closeModal();renderDetail()}else{let nt=makeTrip(templates.find(x=>x.id===f.get('template')),f.get('name'),f.get('destination'),f.get('companions'),f.get('climate'),f.get('activity'));state.trips.push(nt);save();closeModal();showTrip(nt.id)}}}
function openItemEditor(cid,iid){const t=getTrip(active),cat=t.categories.find(c=>c.id===cid),item=iid?cat.items.find(i=>i.id===iid):null;openModal(`<h2>${item?'编辑物品':'新增物品'}</h2><label class="field"><span>物品名称</span><input name="text" required value="${esc(item?.text||'')}" placeholder="例如：儿童雨鞋"></label><label class="field"><span>分配给谁</span><select name="owner"><option ${item?.owner==='全家'?'selected':''}>全家</option><option ${item?.owner==='成人'?'selected':''}>成人</option><option ${item?.owner==='儿童'?'selected':''}>儿童</option><option ${item?.owner==='本人'?'selected':''}>本人</option><option ${item?.owner==='未分配'?'selected':''}>未分配</option></select></label><label class="field"><span>分类</span><select name="category">${t.categories.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.title)}</option>`).join('')}</select></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">保存物品</button></div>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),to=t.categories.find(c=>c.id===f.get('category'));if(item){cat.items=cat.items.filter(i=>i.id!==iid);Object.assign(item,{text:f.get('text'),owner:f.get('owner')});to.items.push(item)}else to.items.push({id:uid(),text:f.get('text'),owner:f.get('owner'),done:false});save();closeModal();renderDetail()}}
function deleteItem(cid,iid){if(confirm('删除这个物品吗？')){let c=getTrip(active).categories.find(c=>c.id===cid);c.items=c.items.filter(i=>i.id!==iid);save();renderDetail()}}function duplicateTrip(id){const c=clone(getTrip(id));c.id=uid();c.name+='（副本）';c.categories.forEach(x=>{x.id=uid();x.items.forEach(i=>{i.id=uid();i.done=false})});state.trips.push(c);save();showTrip(c.id)}function deleteTrip(id){if(confirm('删除整个行程及其勾选进度吗？此操作无法恢复。')){state.trips=state.trips.filter(t=>t.id!==id);save();showHome()}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}document.getElementById('fab').onclick=()=>{let t=getTrip(active);if(t)openItemEditor(t.categories[0].id)};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};renderHome();
</script></body></html>
