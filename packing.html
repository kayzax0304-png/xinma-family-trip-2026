function openItemEditor(cid,iid){const t=getTrip(active),cat=t.categories.find(c=>c.id===cid),item=iid?cat.items.find(i=>i.id===iid):null;openModal(`<h2>${item?'编辑物品':'新增物品'}</h2><label class="field"><span>物品名称</span><input name="text" required value="${esc(item?.text||'')}" placeholder="例如：儿童雨鞋"></label><label class="field"><span>分配给谁</span><select name="owner"><option ${item?.owner==='全家'?'selected':''}>全家</option><option ${item?.owner==='成人'?'selected':''}>成人</option><option ${item?.owner==='儿童'?'selected':''}>儿童</option><option ${item?.owner==='本人'?'selected':''}>本人</option><option ${item?.owner==='未分配'?'selected':''}>未分配</option></select></label><label class="field"><span>分类</span><select name="category">${t.categories.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.title)}</option>`).join('')}</select></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">保存物品</button></div>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),to=t.categories.find(c=>c.id===f.get('category'));if(item){cat.items=cat.items.filter(i=>i.id!==iid);Object.assign(item,{text:f.get('text'),owner:f.get('owner')});to.items.push(item)}else to.items.push({id:uid(),text:f.get('text'),owner:f.get('owner'),done:false});save();closeModal();renderDetail()}}
function deleteItem(cid,iid){if(confirm('删除这个物品吗？')){let c=getTrip(active).categories.find(c=>c.id===cid);c.items=c.items.filter(i=>i.id!==iid);save();renderDetail()}}function duplicateTrip(id){const c=clone(getTrip(id));c.id=uid();c.name+='（副本）';c.categories.forEach(x=>{x.id=uid();x.items.forEach(i=>{i.id=uid();i.done=false})});state.trips.push(c);save();showTrip(c.id)}function deleteTrip(id){if(confirm('删除整个行程及其勾选进度吗？此操作无法恢复。')){state.trips=state.trips.filter(t=>t.id!==id);save();showHome()}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
const rawRenderHome=renderHome;renderHome=function(){rawRenderHome();const grid=document.getElementById('templateGrid');if(state.myTemplates.length)grid.insertAdjacentHTML('beforeend',`<div style="grid-column:1/-1;margin-top:12px"><h3 style="font:700 23px Georgia;margin:8px 0">我的模板</h3><p class="notice">由你保存，仅在这台设备的浏览器内可用。</p></div>${state.myTemplates.map(t=>`<article class="template"><span class="badge">我的模板</span><h3>${esc(t.name)}</h3><p>${t.categories.flatMap(c=>c.items).length} 项 · 保留成员与收纳位置</p><div class="template-actions"><button class="ghost" onclick="createFromMyTemplate('${t.id}')">一键新建</button><button class="ghost" onclick="renameMyTemplate('${t.id}')">重命名</button><button class="ghost" onclick="editMyTemplate('${t.id}')">编辑</button><button class="danger" onclick="deleteMyTemplate('${t.id}')">删除</button></div></article>`).join('')}`)};
const rawRenderDetail=renderDetail;renderDetail=function(){rawRenderDetail();const t=getTrip(active),head=document.querySelector('.trip-head .actions');head.insertAdjacentHTML('beforeend',`<button class="ghost" onclick="saveAsMyTemplate('${t.id}')">保存为我的模板</button><label style="font-size:12px;color:#d7e1dd">收纳位置 <select onchange="setLocationFilter(this.value)" style="padding:8px"><option>全部</option><option ${locationFilter==='随身包'?'selected':''}>随身包</option><option ${locationFilter==='托运行李'?'selected':''}>托运行李</option><option ${locationFilter==='随身优先/两者皆可'?'selected':''}>随身优先/两者皆可</option></select></label><p style="width:100%;font-size:11px;color:#d7e1dd;margin:2px 0">充电宝、备用锂电池、相机电池与重要药物请随身携带；出发前按承运航司规则复核容量与标识要求。</p>`);document.querySelectorAll('.category').forEach((box,ci)=>{const c=t.categories[ci],rows=box.querySelectorAll('.item');c.items.forEach((item,i)=>{const row=rows[i],visible=locationFilter==='全部'||item.location===locationFilter;row.style.display=visible?'grid':'none';const owner=row.querySelector('.owner');owner.textContent=`${item.owner||'未分配'} · ${item.location||locationFor(c.title,item.text)}`;owner.style.fontSize='11px';owner.style.color='#617a73'});const note=box.querySelector('summary small');note.textContent=categoryNotes[c.title]||'可逐件勾选、编辑或删除'})};
function saveAsMyTemplate(id){const trip=clone(getTrip(id));openModal(`<h2>保存为我的模板</h2><label class="field"><span>模板名称</span><input name="name" required value="${esc(trip.name)} 模板"></label><p class="notice">会保留物品、成员与收纳位置；勾选进度会在下次新建行程时清空。</p><div class="actions"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">保存模板</button></div>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();trip.id=uid();trip.name=new FormData(e.target).get('name');trip.categories.forEach(c=>c.items.forEach(i=>{i.id=uid();i.done=false}));state.myTemplates.push(trip);save();closeModal();showHome()}}
function createFromMyTemplate(id){const t=clone(state.myTemplates.find(x=>x.id===id));t.id=uid();t.name+='（新行程）';t.categories.forEach(c=>{c.id=uid();c.items.forEach(i=>{i.id=uid();i.done=false})});state.trips.push(t);save();showTrip(t.id)}
function renameMyTemplate(id){const t=state.myTemplates.find(x=>x.id===id);openModal(`<h2>重命名模板</h2><label class="field"><span>名称</span><input name="name" required value="${esc(t.name)}"></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">保存</button></div>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();t.name=new FormData(e.target).get('name');save();closeModal();showHome()}}
function editMyTemplate(id){const t=state.myTemplates.find(x=>x.id===id);openModal(`<h2>编辑模板物品</h2><p class="notice">输入一行一个物品；保存后会添加到第一个分类。需要调整分类、成员或收纳位置时，先一键新建后编辑，再保存为新模板。</p><label class="field"><span>新增物品</span><input name="items" placeholder="例如：备用眼镜；旅行衣架"></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">保存</button></div>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const items=String(new FormData(e.target).get('items')||'').split(/[；;\n]/).map(x=>x.trim()).filter(Boolean);items.forEach(text=>t.categories[0].items.push({id:uid(),text,owner:'未分配',location:'随身优先/两者皆可',done:false}));save();closeModal();showHome()}}
function deleteMyTemplate(id){if(confirm('删除这个我的模板吗？此操作无法恢复。')){state.myTemplates=state.myTemplates.filter(x=>x.id!==id);save();showHome()}}
function setLocationFilter(value){locationFilter=value;renderDetail()}
function openItemEditor(cid,iid){const t=getTrip(active),cat=t.categories.find(c=>c.id===cid),item=iid?cat.items.find(i=>i.id===iid):null;const loc=item?.location||locationFor(cat.title,item?.text||'');openModal(`<h2>${item?'编辑物品':'新增物品'}</h2><label class="field"><span>物品名称</span><input name="text" required value="${esc(item?.text||'')}" placeholder="例如：儿童雨鞋"></label><label class="field"><span>分配给谁</span><select name="owner">${['全家','成人','儿童','本人','未分配'].map(x=>`<option ${item?.owner===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>收纳位置</span><select name="location">${['随身包','托运行李','随身优先/两者皆可'].map(x=>`<option ${loc===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>分类</span><select name="category">${t.categories.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.title)}</option>`).join('')}</select></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">保存物品</button></div>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),to=t.categories.find(c=>c.id===f.get('category'));if(item){cat.items=cat.items.filter(i=>i.id!==iid);Object.assign(item,{text:f.get('text'),owner:f.get('owner'),location:f.get('location')});to.items.push(item)}else to.items.push({id:uid(),text:f.get('text'),owner:f.get('owner'),location:f.get('location'),done:false});save();closeModal();renderDetail()}}
function openBackupPanel(){openModal(`<h2>跨设备备份</h2><p class="notice">导出后通过系统分享保存到 iCloud Drive；另一台设备打开本页，选择该文件即可恢复。</p><div class="actions"><button type="button" class="ghost" onclick="exportBackup()">导出备份</button><button type="button" class="primary" onclick="closeModal();document.getElementById('backupFile').click()">从备份恢复</button></div><p class="notice">恢复会替换当前浏览器内的全部行程、模板和勾选进度。建议先导出一份再恢复。</p>`)}
function backupPayload(){return{format:'travel-packing-backup',version:1,exportedAt:new Date().toISOString(),data:state}}
async function exportBackup(){const filename=`旅行打包备份-${new Date().toISOString().slice(0,10)}.json`,file=new File([JSON.stringify(backupPayload(),null,2)],filename,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'旅行打包备份',text:'将此文件保存到 iCloud Drive，方便在另一台设备恢复。',files:[file]});return}}catch(e){if(e.name==='AbortError')return}const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('备份已导出。请在下载或分享菜单中保存到 iCloud Drive。')}
document.getElementById('backupFile').onchange=async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const payload=JSON.parse(await file.text());if(payload?.format!=='travel-packing-backup'||!payload?.data||!Array.isArray(payload.data.trips))throw new Error('invalid');if(!confirm(`恢复“${file.name}”中的备份吗？这会替换当前浏览器内的全部行程、模板和勾选进度。`))return;state=payload.data;state.myTemplates=Array.isArray(state.myTemplates)?state.myTemplates:[];state.trips.forEach(migrateTrip);state.trips.forEach(t=>t.categories.forEach(c=>c.items.forEach(i=>{if(!i.location)i.location=locationFor(c.title,i.text)})));active=null;locationFilter='全部';save();showHome();alert('恢复完成。')}catch(err){alert('这个文件不是可用的旅行打包备份，请选择由本工具导出的 .json 文件。')}};
document.getElementById('fab').onclick=()=>{let t=getTrip(active);if(t)openItemEditor(t.categories[0].id)};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};renderHome();
</script></body></html>
