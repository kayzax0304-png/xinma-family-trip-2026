['9/28','槟城','抵达 · 海边度假','🟢 轻松','ZH335 · 12:00 抵达 PEN','Shangri-La Rasa Sayang',[['14:30','Shangri-La Rasa Sayang','入住 · 海边度假',5.4799,100.2548,I.beach,'百年雨树环绕的海滨度假村。抵达后的下午只留给泳池、花园与沙滩，让旅行从松弛开始。','先确认儿童池位置，再沿花园走到沙滩；重点放在泳池、古树和黄昏海风。','亲子泳池|海边日落'],['17:30','Batu Ferringhi Beach','海边看日落',5.4751,100.2468,I.beach,'槟城最著名的海滩带。黄昏光线柔和，适合散步和拍下全家旅行的第一张合照。','日落前约半小时抵达即可，选较安静的沙段玩沙更省心。','日落|轻松散步'],['18:30','Long Beach Cafe','长园 Hawker 晚餐',5.4745,100.2461,I.food,'选择丰富、带娃友好的露天美食中心。','先绕一圈再点，用炒粿条或福建面做主食，沙爹分着尝。','本地小吃|现场点餐'],['19:30','Batu Ferringhi Night Market','夜市 · Fire Show',5.4749,100.2454,I.garden,'沿海岸铺开的夜市，适合饭后慢慢逛。','当天若有火舞就看，没有也不用等；夜市不是必须购物。','夜市|弹性安排']]],
['9/29','槟城','娘惹文化 · 老城','🟡 正常','','Penang Marriott Executive Apartments',[['12:20','Penang Marriott Executive Apartments','换酒店 · 寄存行李',5.4361,100.3116,I.city,'面朝海峡的公寓式酒店，是两天老城探索的舒适基地。','寄好行李后直接前往老城，下午行程不必回头。','已预订|Gurney'],['15:00','Pinang Peranakan Mansion','娘惹文化重点',5.4182,100.3412,I.heritage,'以华丽宅邸、家具和器物呈现峇峇娘惹生活。','先看中庭、彩色地砖与婚房；跟讲解抓住代表性藏品更有收获。','建议讲解|约90分钟'],['16:35','Little India','香料与街巷',5.4177,100.3385,I.heritage,'色彩、音乐与香料气味扑面而来的老城街区。','沿 Market Street 和 Queen Street 走一圈即可，炎热时优先补水。','街区漫步|免费'],['18:00','Emerald Nyonya Cuisine','重点娘惹晚餐',5.4145,100.3336,I.food,'这趟槟城最值得提前订的一顿饭。','一荤、一海鲜、一蔬菜加主食组合；给孩子单独确认不辣菜。','待预约|2大1小'],['19:40','Love Lane','饭后慢逛',5.4192,100.3356,I.garden,'老屋、酒吧与小店连成的短街。','晚饭后看看氛围即可，不必久留，累了随时回酒店。','夜间街景|随时可撤']]],
['9/30','槟城','George Town · 升旗山','🟠 偏满','','Penang Marriott Executive Apartments',[['10:15','Toh Soon Cafe','多春茶室早餐',5.4186,100.3315,I.food,'藏在窄巷中的炭烤咖椰吐司老店。','排队超过20分钟就换店；咖椰吐司、半熟蛋和咖啡已足够。','炭烤吐司|排队设上限'],['11:00','Khoo Kongsi','邱公司',5.4146,100.3355,I.heritage,'乔治市最华丽的华人宗祠之一。','先退到广场中央看屋顶，再靠近看木雕、石雕和陶塑。','建筑细节|约45分钟'],['11:50','Armenian Street','壁画与骑楼',5.4145,100.3344,I.heritage,'槟城经典壁画最集中的区域。','不必逐张集邮，壁画、木门与五脚基本身就是精华。','壁画|亲子拍照'],['13:15','Chew Jetty','姓周桥',5.4119,100.3402,I.beach,'延伸进海面的传统水上聚落。','走到木栈桥尽头吹风；这里仍是居民生活空间，拍照勿对屋内。','水上人家|约45分钟'],['16:15','Penang Hill Lower Station','升旗山 · 日落',5.4075,100.2772,I.hill,'搭缆车上山看乔治市与海峡全景。','Fast Lane 主要节省排队；先看能见度，再按体力决定散步。','Fast Lane 待购|日落']]],
['10/1','吉隆坡','转场 · 双子塔夜景','🟡 正常','MH1149 · 15:50 PEN → KUL','Four Points by Sheraton KLCC',[['12:45','Penang International Airport','前往机场',5.2972,100.2769,I.city,'转场日不抢行程，预留充足值机与安检时间。','午饭从简，按国内航班节奏抵达机场。','国内航班|15:50起飞'],['19:15','Four Points by Sheraton KLCC','入住',3.1601,101.7060,I.kl,'位于 KLCC 北侧，去双子塔很方便。','放好行李后直接走夜景路线。','已预订|2晚'],['20:45','Petronas Twin Towers','双子塔夜景',3.1579,101.7117,I.kl,'吉隆坡最标志性的天际线。','不登塔，从公园与广场换不同视角即可。','城市地标|不登塔'],['21:15','KLCC Park','Lake Symphony',3.1554,101.7121,I.garden,'在公园散步并顺路看音乐喷泉。','航班延误或孩子累了，看十几分钟夜景就回酒店。','音乐喷泉|免费']]],
['10/2','吉隆坡','老城 · TRX','🟡 正常','','Four Points by Sheraton KLCC',[['10:20','Hock Kee Heritage','老KL早餐',3.1486,101.6963,I.food,'南洋早餐与老派咖啡店氛围。','用轻松早餐开启老城步行线。','南洋早餐|慢开始'],['11:15','Masjid Jamek','占美清真寺',3.1493,101.6954,I.heritage,'位于两河交汇处，是理解吉隆坡城市起源的地标。','先在河岸看穹顶与尖塔，再沿 River of Life 前进。','历史地标|River of Life'],['12:30','Central Market','中央艺术坊',3.1457,101.6955,I.city,'空调里的手工艺与伴手礼集中地。','商品同质化时不必逐店比较，优先买轻便设计品。','伴手礼|空调休息'],['15:30','The Exchange TRX','新KL',3.1417,101.7189,I.city,'从老城切换到现代吉隆坡的补给站。','喝咖啡、补给后去屋顶公园，让孩子放电。','购物中心|补给'],['16:15','TRX City Park','屋顶亲子公园',3.1425,101.7196,I.garden,'高楼之间的大型屋顶绿地与儿童区。','若玩水，替换衣物和毛巾放在随手可取的位置。','亲子重点|备用衣服'],['19:30','Bijan Bar & Restaurant','正式马来晚餐',3.1495,101.7072,I.food,'精致但不拘谨的马来菜，更有旅行记忆感。','最终订位前与轻松版餐厅再复核。','候选首选|待预约']]],
['10/3','新加坡','鱼尾狮 · Supertree','🟡 正常','AK715 · 14:25 KUL → SIN','Grand Hyatt Singapore',[['17:30','Grand Hyatt Singapore','入住',1.3067,103.8320,I.sg,'Orchard 核心位置，两晚都住这里。','放好行李后直接前往滨海湾。','已预订|2晚'],['18:20','Merlion Park','第一次看新加坡',1.2868,103.8545,I.sg,'鱼尾狮与金沙同框的经典机位。','先去远处观景平台拍全景，再靠近拍互动照，30分钟足够。','经典机位|30分钟'],['19:25','Supertree Grove','超级树',1.2816,103.8636,I.garden,'未来感最强的新加坡画面。','表演前15分钟找中央位置，带轻便防潮布更舒服。','免费|提前占位'],['19:45','Garden Rhapsody','灯光音乐秀',1.2816,103.8636,I.garden,'第一晚的固定核心项目。','站得太近反而看不全，结束后稍等几分钟再离场。','固定时间|核心项目']]],
['10/4','新加坡','植物园 · Night Safari','🟠 偏满','','Grand Hyatt Singapore',[['10:30','Singapore Botanic Gardens','热带植物园',1.3138,103.8159,I.garden,'世界遗产级的城市绿洲。','以 Swan Lake、老树与草坪组成轻松路线，不追求走完全园。','自然|约90分钟'],['12:15','The Dempsey Cookhouse and Bar','Dempsey午餐',1.3051,103.8092,I.food,'漂亮但带孩子没有压力的一顿正式午餐。','先处理儿童椅与孩子餐食，再慢慢享用大人的菜。','待预约|High Chair'],['14:00','National Gallery Singapore','艺术与建筑',1.2903,103.8519,I.museum,'旧最高法院与市政厅改造而成的艺术馆。','不试图看完馆藏，精选两三个展厅；孩子累了就转看建筑。','弹性看展|亲子策略'],['17:15','Mandai Wildlife Reserve','晚饭与休息',1.4038,103.7930,I.garden,'提前到 Mandai，方便优先。','先吃饭、上厕所、补水，不追求餐饮质量。','提前抵达|方便优先'],['19:15','Night Safari','夜间动物园',1.4021,103.7882,I.garden,'全程核心：先 Tram，再走一条 Trail。','园区昏暗，手机拍摄不必强求；把注意力放在声音与夜间行为。','早场待购|Tram必做']]],
['10/5','返程','Orchard · Jewel','🟢 轻松','ZH230 · 19:00 SIN → SZX','当晚抵达深圳',[['10:00','Merci Marcel Orchard','最后一顿 Brunch',1.3035,103.8322,I.food,'用一顿松弛的早午餐收尾。','之后在 Orchard 随意逛逛，不设置购物任务。','候选|慢收尾'],['12:00','Grand Hyatt Singapore','退房 · 取行李',1.3067,103.8320,I.sg,'确认行李与证件，再前往樟宜。','13:30左右出发，给 Jewel 留足时间。','退房|行李确认'],['14:30','Jewel Changi Airport','雨漩涡与森林谷',1.3602,103.9898,I.jewel,'先看 Rain Vortex 与 Forest Valley。','高层先看整体，再下到森林谷；抵达先确认瀑布运行状态。','免费核心景观|不提前买票'],['16:30','Singapore Changi Airport T1','进入离境流程',1.3644,103.9915,I.city,'正式办理值机、托运和出境。','航班19:00起飞，不再追加景点。','ZH230|19:00起飞']]]];
let day=0,sel=0,map,markers=[];const $=id=>document.getElementById(id);function route(p){return`https://www.google.com/maps/dir/?api=1&destination=${p[3]},${p[4]}&travelmode=driving`}function grab(p){return`https://grab.onelink.me/2695613898?pid=inappsharing&c=1000880&af_dp=grab%3A%2F%2Fopen%3FscreenType%3DBOOKING%26dropOffLatitude%3D${p[3]}%26dropOffLongitude%3D${p[4]}%26dropOffAddress%3D${encodeURIComponent(p[1])}`}function render(){const d=D[day],p=d[6][sel];$('days').innerHTML=D.map((x,i)=>`<button class="${i===day?'active':''}" onclick="chooseDay(${i})"><small>DAY ${i+1}</small><b>${x[0]} ${x[1]}</b><i>${x[2]}</i></button>`).join('');$('label').textContent=`DAY ${day+1} · ${d[0]}`;$('title').textContent=d[2];$('stay').textContent=`${d[4]||'全天城市行程'} · 住宿：${d[5]}`;$('level').textContent=`${d[3]} · ${d[6].length} 个停靠点`;$('list').innerHTML=d[6].map((x,i)=>`<button class="${i===sel?'active':''}" onclick="chooseStop(${i})"><span class="num">${i+1}</span><time>${x[0]}</time><span><b>${x[1]}</b><small>${x[2]}</small></span></button>`).join('');$('photo').style.backgroundImage=`linear-gradient(0deg,rgba(12,35,30,.35),transparent),url(${p[5]})`;$('pin').textContent=sel+1;$('time').textContent=`${p[0]} · 行程亮点`;$('name').textContent=p[1];$('blurb').textContent=p[6];$('tip').textContent=p[7];$('tags').innerHTML=p[8].split('|').map(t=>`<i>${t}</i>`).join('');$('google').href=route(p);$('grab').href=grab(p);draw(d[6])}function chooseDay(i){day=i;sel=0;render()}function chooseStop(i){sel=i;render();map.flyTo([D[day][6][i][3],D[day][6][i][4]],15,{duration:.5})}function draw(points){if(map)map.remove();map=L.map('map',{zoomControl:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);const latlng=points.map((p,i)=>{const icon=L.divIcon({className:'',html:`<div style="width:34px;height:34px;border-radius:50%;background:${i===sel?'#e46649':'#fffdf8'};border:3px solid #17372f;color:#17372f;display:grid;place-items:center;font-weight:bold">${i+1}</div>`,iconSize:[34,34],iconAnchor:[17,17]});L.marker([p[3],p[4]],{icon}).addTo(map).on('click',()=>chooseStop(i));return[p[3],p[4]});L.polyline(latlng,{color:'#e46649',weight:4,dashArray:'8 10'}).addTo(map);map.fitBounds(latlng,{padding:[45,45],maxZoom:15})}render();
